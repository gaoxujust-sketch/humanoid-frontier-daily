title: 人形与智能前沿日刊
description: 每日一判 · 人形机器人 × 通用大模型
lang: zh-CN

kramdown:
  input: GFM
  hard_wrap: false

remote_theme: just-the-docs/just-the-docs@v0.10.1

plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings
  - jekyll-relative-links

search_enabled: true
heading_anchors: true

exclude:
  - templates/
