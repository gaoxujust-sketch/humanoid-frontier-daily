<style>
  /* ===== 日刊视觉系统：纸面感 + 衬线标题 + 卡片化条目 ===== */
  :root {
    --paper: #faf8f4;
    --ink: #1f2430;
    --accent: #9a3b26;
    --accent-soft: #f5e9e2;
    --line: #e7e0d4;
    --card-bg: #ffffff;
  }
  body { background: var(--paper); }
  .main { background: var(--paper); }
  .main-content {
    max-width: 62rem;
    line-height: 1.85;
    font-size: 1.02rem;
    color: var(--ink);
  }
  .main-content h1, .main-content h2, .journal-title {
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    letter-spacing: 0.01em;
  }
  .main-content h1 { font-size: 1.9rem; line-height: 1.35; margin-bottom: 1.2rem; }
  .main-content h2 {
    font-size: 1.45rem;
    margin-top: 2.6rem;
    padding-bottom: 0.35rem;
    border-bottom: 2px solid var(--line);
  }
  .main-content h3 { font-size: 1.16rem; margin-top: 1.6rem; line-height: 1.55; }
  .main-content p, .main-content li { letter-spacing: 0.01em; }
  .main-content table { font-size: 0.95rem; }
  .main-content a { text-underline-offset: 0.18em; }
  .side-bar { font-size: 0.95rem; }

  /* 阅读进度条 */
  #read-progress {
    position: fixed; top: 0; left: 0; height: 3px; width: 0;
    background: var(--accent); z-index: 9999; transition: width 0.08s linear;
  }

  /* 首页刊头 */
  .journal-hero { text-align: left; padding: 1.2rem 0 0.4rem; }
  .journal-kicker {
    font-size: 0.78rem; letter-spacing: 0.22em; color: var(--accent);
    font-weight: 700; margin-bottom: 0.6rem;
  }
  .journal-title { font-size: 2.5rem; line-height: 1.25; margin: 0 0 0.8rem; }
  .journal-sub { font-size: 1.05rem; color: #4a4f57; max-width: 44rem; }

  /* 最新一期大卡 */
  .latest-card {
    background: var(--card-bg); border: 1px solid var(--line); border-radius: 16px;
    padding: 1.6rem 1.8rem; margin: 1rem 0 0.5rem;
    box-shadow: 0 6px 24px rgba(31, 36, 48, 0.06);
  }
  .latest-label { font-size: 0.75rem; letter-spacing: 0.2em; color: var(--accent); font-weight: 700; }
  .latest-title {
    display: block; font-family: "Songti SC", "Noto Serif SC", serif;
    font-size: 1.7rem; line-height: 1.4; color: var(--ink); margin: 0.5rem 0;
    text-decoration: none;
  }
  .latest-title:hover { color: var(--accent); }
  .latest-note { color: #4a4f57; margin: 0.2rem 0 1rem; }
  .read-btn {
    display: inline-block; background: var(--accent); color: #fff !important;
    padding: 0.5rem 1.2rem; border-radius: 999px; text-decoration: none; font-weight: 600;
  }

  /* 往期卡片网格 */
  .issue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.9rem; margin-top: 1rem; }
  .issue-card {
    display: flex; flex-direction: column; gap: 0.6rem;
    background: var(--card-bg); border: 1px solid var(--line); border-radius: 14px;
    padding: 1.1rem 1.2rem; text-decoration: none; color: var(--ink);
  }
  .issue-card:hover { border-color: var(--accent); }
  .issue-card-title { font-family: "Songti SC", "Noto Serif SC", serif; font-size: 1.12rem; line-height: 1.45; }
  .issue-card-go { color: var(--accent); font-size: 0.9rem; font-weight: 600; }

  /* 栏目格 */
  .columns-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.9rem; margin-top: 1rem; }
  .column-cell { background: var(--card-bg); border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.2rem; display: flex; flex-direction: column; gap: 0.3rem; }
  .column-cell strong { font-size: 1.05rem; }
  .column-cell span { color: #4a4f57; font-size: 0.94rem; line-height: 1.6; }

  /* 今日一判高亮框 */
  .verdict-box {
    background: var(--accent-soft); border-left: 5px solid var(--accent);
    border-radius: 0 14px 14px 0; padding: 1.1rem 1.4rem; margin: 1rem 0;
  }
  .verdict-box p:first-child { font-size: 1.12rem; }

  /* 每条动态的故事卡 */
  .story-card {
    background: var(--card-bg); border: 1px solid var(--line); border-radius: 14px;
    padding: 1.15rem 1.35rem; margin: 1rem 0;
    box-shadow: 0 2px 10px rgba(31, 36, 48, 0.04);
  }
  .story-card h3 { margin-top: 0.2rem; }
  .story-card ul { margin-bottom: 0.3rem; }
  .judge-line {
    background: var(--accent-soft); border-radius: 8px;
    padding: 0.35rem 0.7rem; list-style: none; margin-left: -1.4rem;
    font-weight: 600;
  }
  .source-line a { font-weight: 600; }
</style>
