<div id="read-progress"></div>
<script>
(function () {
  var bar = document.getElementById('read-progress');
  function onScroll() {
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
  }
  document.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  var main = document.querySelector('.main-content');
  if (!main) return;
  var heads = Array.prototype.slice.call(main.querySelectorAll('h2'));
  var verdict = null;
  heads.forEach(function (h) { if (h.textContent.indexOf('今日一判') > -1) verdict = h; });
  if (!verdict) return;

  function chipLi(li) {
    var t = li.textContent.trim();
    if (t.indexOf('判断：') === 0) {
      li.classList.add('judge-line');
      var text = t.replace(/^判断：/, '');
      var cls = 'judge-default';
      if (text.indexOf('真突破') > -1) cls = 'judge-breakthrough';
      else if (text.indexOf('落地') > -1 || text.indexOf('信号') > -1) cls = 'judge-signal';
      else if (text.indexOf('噪音') > -1 || text.indexOf('演示') > -1) cls = 'judge-noise';
      li.innerHTML = '';
      var chip = document.createElement('span');
      chip.className = 'judge-chip ' + cls;
      chip.textContent = '判断 · ' + text;
      li.appendChild(chip);
    }
    if (t.indexOf('来源：') === 0) li.classList.add('source-line');
  }

  function groupUntil(startEl, stops) {
    var nodes = [], el = startEl.nextElementSibling;
    while (el && stops.indexOf(el.tagName) === -1) { nodes.push(el); el = el.nextElementSibling; }
    return nodes;
  }
  function wrap(nodes, cls) {
    if (!nodes.length) return null;
    var box = document.createElement('div');
    box.className = cls;
    nodes[0].parentNode.insertBefore(box, nodes[0]);
    nodes.forEach(function (n) { box.appendChild(n); });
    return box;
  }

  var vbox = wrap(groupUntil(verdict, ['H2']), 'verdict-box');
  if (vbox) vbox.querySelectorAll('li').forEach(chipLi);

  heads.forEach(function (h) {
    if (h === verdict) return;
    var section = groupUntil(h, ['H2']);
    section.filter(function (n) { return n.tagName === 'H3'; }).forEach(function (h3) {
      var m = h3.textContent.match(/（([^）]*?)(\d{4}-\d{2}-\d{2})([^）]*）\s*$/);
      if (m) {
        var rest = (m[1] + m[3]).replace(/^[，、\s]+|[，、\s]+$/g, '').replace(/，{2,}/g, '，');
        var base = h3.textContent.replace(/（[^）]*\d{4}-\d{2}-\d{2}[^）]*）\s*$/, '');
        h3.textContent = rest ? base + '（' + rest + '）' : base;
        var badge = document.createElement('span');
        badge.className = 'date-badge';
        badge.textContent = m[2];
        h3.appendChild(badge);
      }
      var nodes = [h3], el = h3.nextElementSibling;
      while (el && el.tagName !== 'H3' && el.tagName !== 'H2') { nodes.push(el); el = el.nextElementSibling; }
      var card = wrap(nodes, 'story-card');
      if (!card) return;
      card.querySelectorAll('li').forEach(chipLi);
    });
  });
})();
</script>
